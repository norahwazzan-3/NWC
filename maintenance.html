<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maintenance Request</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-100 to-blue-200 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-5xl">
    <div class="text-center mb-10">
      <h2 class="text-4xl font-extrabold text-blue-800 mb-3">Maintenance Request</h2>
      <p class="text-gray-600 text-lg">Help us solve your problem.</p>
    </div>

    <form action="submit_request.php" method="POST" enctype="multipart/form-data" class="space-y-6">
      <input type="hidden" name="service_type" value="request_call" />

      <!-- Two Column Layout -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Left Column -->
        <div class="space-y-6">
          <!-- Area -->
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Area in KSA</label>
            <select name="area" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">-- Select Area --</option>
              <optgroup label="Central Region">
                <option value="riyadh">Riyadh</option>
                <option value="alqassim">Al-Qassim-Buraydah</option>
                <option value="alqassim2">Al-Qassim-Unaizah</option>
                <option value="dawadmi">Dawadmi</option>
                <option value="wadi_dawasir">Wadi ad-Dawasir</option>
                <option value="shaqra">Shaqra</option>
                <option value="majmaah">Al Majma'ah</option>
                <option value="zulfi">Al Zulfi</option>
                <option value="kharj">Al Kharj</option>
                <option value="ghat">Al Ghat</option>
                <option value="afif">Afif</option>
              </optgroup>
              <optgroup label="Northern Region">
                <option value="hail">Hail</option>
                <option value="arar">Arar</option>
                <option value="rafha">Rafha</option>
                <option value="turaif">Turaif</option>
                <option value="sakaka">Sakaka</option>
                <option value="qurayyat">Qurayyat</option>
                <option value="domat_al_jandal">Domat Al Jandal</option>
                <option value="tabarjal">Tabarjal</option>
              </optgroup>
            </select>
          </div>

          <!-- Address -->
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Address</label>
            <input type="text" name="address" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- Preferred Time -->
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Preferred Time</label>
            <input type="time" name="preferred_time" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Right Column -->
        <div class="space-y-6">
          <!-- Maintenance Type -->
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Maintenance Type</label>
            <select name="maintenance_type" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">-- Select --</option>
              <option value="leaks">Leaks</option>
              <option value="meter">Meter</option>
              <option value="sewage">Sewage</option>
            </select>
          </div>

          <!-- Issue Description -->
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Issue Description</label>
            <textarea name="call_reason" rows="5" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
          </div>

          <!-- Upload -->
          <div>
            <label class="block mb-2 text-gray-700 font-medium">Upload Image or Video (optional)</label>
            <input type="file" name="attachment" accept="image/*,video/*" class="w-full px-4 py-2 border rounded-lg">
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold py-3 rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all shadow-md">
          Submit Request
        </button>
      </div>

      <!-- Home Button -->
      <a href="index.php" 
         class="fixed bottom-6 right-6 bg-blue-600 text-white text-xl p-4 rounded-full shadow-lg hover:bg-blue-700 transition duration-300 z-50"
         title="Back to Home">
        <i class="fas fa-home"></i>
      </a>
    </form>
  </div>

</body>
</html>
